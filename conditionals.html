<!DOCTYPE html>

<body>
    <div>
        <p>Conditional statements</p>
    </div>
    <script>
         
         let x = Number(prompt("Enter a random number"))

         if (x % 2 == 0){
            console.log("Even")
         }else{
            console.log("Odd")
         }


         let num1 = Number(prompt("Enter num1"))
         let num2 = Number(prompt("Enter num2"))
         let num3 = Number(prompt("Enter num3"))

         if (num1 > num2 && num1 > num3){
            console.log(`${num1} is the largest`)
         }else if (num2 > num1 && num2 > num3){
            console.log(`${num2} is the largest`)
         }else{
            console.log(`${num3} is the largest`)
         }
         

// Write that prompts the user to input student marks.
//  The input should be between 0 and 100.Then output the correct grade: 
// A > 79 , B - 60 to 79, C  > 49 to 59, D - 40 to 49, E - less 40


      let marks = Number(prompt("Enter marks"))

      if(marks >= 0 && marks <=100){
            if(marks > 79){
               console.log("A")
            }else if( marks >= 60 && marks <=79){
               console.log("B")
            }else if(marks > 49 && marks <= 59){
               console.log("C")
            }else if(marks >= 40 && marks <= 49){
               console.log("D")
            }else{
               console.log("E")
            }
      }else{
         console.log("Invalid mark entered , mark should be between 0 and 100")
      }









         let year = Number(prompt("Enter a random year"))

         if (((year %4==0) && (year %100 !=0)) || (year % 400 ==0)){
             console.log("Year is leap")
         }else{
            console.log("Year is not leap")
         }

         //ternary operator

         let number = Number(prompt("Enter a random number"))

         let is_even = number %2 == 0 ? "Even" : "Odd"
         console.log(is_even)
         
         // use a ternary operator to write a program that checks whether a person is eligible to drive , assume legal age of 18
         let age = Number(prompt("Enter a random age"))
         let can_drive = age >= 18 ? "can drive" :"cannot drive"
         console.log(can_drive)

    </script>
</body>
